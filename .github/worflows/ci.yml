name: Server — lint and test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask requests pytz flake8 africastalking

      - name: Lint
        run: flake8 src/ --max-line-length=120 --ignore=E501,W503

      - name: Template check
        run: |
          python -c "
          from flask import Flask
          app = Flask(__name__, template_folder='src/templates')
          with app.app_context():
              from flask import render_template_string
              import os
              for t in os.listdir('src/templates'):
                  print(f'Template OK: {t}')
          "

      - name: Import check
        run: |
          cd src
          python -c "from config import DB_CONFIG, FLASK_CONFIG, API_KEY; print('config OK')"
          python -c "from messaging import detect_language, STRINGS; print('messaging OK')"
