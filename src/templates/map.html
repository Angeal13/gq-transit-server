<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioko Transporte — Mapa en Vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #16213e; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #0f3460; }
  #header h1 { font-size: 18px; color: #e94560; }
  #header span { font-size: 12px; color: #aaa; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #main { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }
  #sidebar { width: 300px; background: #16213e; display: flex; flex-direction: column; overflow: hidden; }
  #planner { padding: 14px; border-bottom: 1px solid #0f3460; }
  #planner h2 { font-size: 14px; color: #e94560; margin-bottom: 10px; }
  #planner select, #planner input {
    width: 100%; padding: 7px 10px; margin-bottom: 8px;
    background: #1a1a2e; border: 1px solid #0f3460; color: #eee;
    border-radius: 6px; font-size: 13px;
  }
  #planner button {
    width: 100%; padding: 8px; background: #e94560; color: #fff;
    border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold;
  }
  #planner button:hover { background: #c73652; }
  #eta-results { padding: 10px 14px; font-size: 13px; }
  .eta-card { background: #0f3460; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .eta-card .route-id { font-size: 11px; color: #aaa; }
  .eta-card .eta-time { font-size: 20px; font-weight: bold; color: #4caf50; }
  .eta-card .eta-stops { font-size: 11px; color: #aaa; }
  #buses-list { flex: 1; overflow-y: auto; padding: 14px; }
  #buses-list h2 { font-size: 14px; color: #e94560; margin-bottom: 10px; }
  .bus-item { background: #0f3460; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; }
  .bus-item .bus-id { color: #4caf50; font-weight: bold; }
  .bus-item .bus-stop { color: #eee; }
  .bus-item .bus-dir { color: #aaa; font-size: 11px; }
  #lang-switch { padding: 6px 14px; display: flex; gap: 8px; }
  #lang-switch button { background: #0f3460; color: #eee; border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #lang-switch button.active { background: #e94560; }
  @media (max-width: 600px) { #sidebar { display: none; } }
</style>
</head>
<body>

<div id="header">
  <div id="status-dot"></div>
  <h1>🚌 Bioko Transporte</h1>
  <span id="last-update">Actualizando...</span>
</div>

<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <div id="lang-switch">
      <button class="active" onclick="setLang('es')">ES</button>
      <button onclick="setLang('fr')">FR</button>
      <button onclick="setLang('en')">EN</button>
    </div>
    <div id="planner">
      <h2 id="lbl-planner">🗺️ Planificador de ruta</h2>
      <select id="sel-origin"><option value="">— Origen —</option></select>
      <select id="sel-dest"><option value="">— Destino —</option></select>
      <button onclick="planRoute()" id="btn-plan">Ver mejores rutas</button>
      <div id="eta-results"></div>
    </div>
    <div id="buses-list">
      <h2 id="lbl-buses">🚌 Buses activos</h2>
      <div id="bus-items">Cargando...</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map setup ────────────────────────────────────────────────────────────────
const map = L.map('map').setView([3.75, 8.78], 12); // Malabo, Bioko

// OpenStreetMap tiles (works offline if pre-cached)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

// Bus icon
const busIcon = L.divIcon({
  html: '<div style="background:#e94560;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)">🚌</div>',
  iconSize: [28, 28], iconAnchor: [14, 14], className: ''
});

const stopIcon = L.divIcon({
  html: '<div style="background:#0f3460;border:2px solid #4caf50;border-radius:50%;width:10px;height:10px;"></div>',
  iconSize: [10, 10], iconAnchor: [5, 5], className: ''
});

let busMarkers = {};
let stopMarkers = [];
let routeLines  = [];

// ── Load static data ──────────────────────────────────────────────────────────
async function loadStops() {
  const r = await fetch('/api/stops?region=Bioko');
  const stops = await r.json();
  // Populate selects
  const sel1 = document.getElementById('sel-origin');
  const sel2 = document.getElementById('sel-dest');
  stops.forEach(s => {
    if (s.lat && s.lng) {
      const m = L.marker([s.lat, s.lng], {icon: stopIcon}).addTo(map);
      m.bindTooltip(s.name, {permanent: false, direction: 'top'});
      stopMarkers.push(m);
    }
    sel1.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    sel2.innerHTML += `<option value="${s.name}">${s.name}</option>`;
  });
}

async function loadRouteLines() {
  const r = await fetch('/api/routes/map?region=Bioko');
  const routes = await r.json();
  const colors = ['#e94560','#4caf50','#2196f3','#ff9800','#9c27b0','#00bcd4'];
  routes.forEach((route, i) => {
    const latlngs = route.stops.filter(s=>s.lat&&s.lng).map(s=>[s.lat,s.lng]);
    if (latlngs.length > 1) {
      L.polyline(latlngs, {color: colors[i % colors.length], weight: 3, opacity: 0.6})
       .addTo(map)
       .bindTooltip(`Ruta ${route.id}`, {sticky: true});
    }
  });
}

// ── Live bus positions ─────────────────────────────────────────────────────────
async function updatePositions() {
  try {
    const r   = await fetch('/api/positions?region=Bioko');
    const pos = await r.json();
    const seen = new Set();

    pos.forEach(p => {
      if (!p.lat || !p.lng) return;
      seen.add(p.bus_id);
      if (busMarkers[p.bus_id]) {
        busMarkers[p.bus_id].setLatLng([p.lat, p.lng]);
        busMarkers[p.bus_id].setTooltipContent(`${p.bus_id.slice(-5)} — ${p.stop_name}`);
      } else {
        const m = L.marker([p.lat, p.lng], {icon: busIcon}).addTo(map);
        m.bindTooltip(`${p.bus_id.slice(-5)} — ${p.stop_name}`, {permanent: false});
        busMarkers[p.bus_id] = m;
      }
    });

    // Remove stale markers
    Object.keys(busMarkers).forEach(id => {
      if (!seen.has(id)) {
        map.removeLayer(busMarkers[id]);
        delete busMarkers[id];
      }
    });

    // Update sidebar list
    const listEl = document.getElementById('bus-items');
    if (!pos.length) {
      listEl.innerHTML = `<div style="color:#aaa;font-size:12px">${T.no_buses}</div>`;
    } else {
      listEl.innerHTML = pos.map(p =>
        `<div class="bus-item">
           <div class="bus-id">🚌 ${p.bus_id.slice(-8)}</div>
           <div class="bus-stop">${p.stop_name || '—'}</div>
           <div class="bus-dir">→ ${p.direction || '?'}  (${p.route_id || '?'})</div>
         </div>`).join('');
    }

    document.getElementById('last-update').textContent =
      `${T.updated}: ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    console.error('Position update failed', e);
  }
}

// ── Route planner ─────────────────────────────────────────────────────────────
async function planRoute() {
  const origin = document.getElementById('sel-origin').value;
  const dest   = document.getElementById('sel-dest').value;
  const el     = document.getElementById('eta-results');
  if (!origin || !dest) { el.innerHTML = `<div style="color:#aaa">${T.pick_stops}</div>`; return; }
  el.innerHTML = `<div style="color:#aaa">${T.searching}</div>`;
  try {
    const r    = await fetch(`/api/eta?from=${encodeURIComponent(origin)}&to=${encodeURIComponent(dest)}&region=Bioko`);
    const data = await r.json();
    if (!data.routes || !data.routes.length) {
      el.innerHTML = `<div style="color:#aaa">${T.no_routes}</div>`;
      return;
    }
    el.innerHTML = data.routes.map(route => {
      if (!route.eta_minutes) {
        return `<div class="eta-card"><div class="route-id">${T.route} ${route.route_id}</div><div style="font-size:12px;color:#aaa">${T.no_data}</div></div>`;
      }
      return `<div class="eta-card">
        <div class="route-id">${T.route} ${route.route_id}</div>
        <div class="eta-time">${route.eta_minutes} min</div>
        <div class="eta-stops">${route.stops} ${T.stops}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div style="color:#e94560">${T.error}</div>`;
  }
}

// ── Localisation ───────────────────────────────────────────────────────────────
const LANG = {
  es: { no_buses:'Sin buses activos.', updated:'Actualizado', route:'Ruta', stops:'paradas', pick_stops:'Selecciona origen y destino.', searching:'Buscando...', no_routes:'Sin rutas disponibles.', no_data:'Datos insuficientes (45 días).', error:'Error al consultar.' },
  fr: { no_buses:'Aucun bus actif.', updated:'Mis à jour', route:'Route', stops:'arrêts', pick_stops:'Choisissez départ et arrivée.', searching:'Recherche...', no_routes:'Aucune route disponible.', no_data:'Données insuffisantes (45j).', error:'Erreur de consultation.' },
  en: { no_buses:'No active buses.', updated:'Updated', route:'Route', stops:'stops', pick_stops:'Select origin and destination.', searching:'Searching...', no_routes:'No routes available.', no_data:'Insufficient data (45 days).', error:'Query error.' },
};
let T = LANG.es;

function setLang(lang) {
  T = LANG[lang] || LANG.es;
  document.querySelectorAll('#lang-switch button').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadStops();
loadRouteLines();
updatePositions();
setInterval(updatePositions, 10000);   // refresh every 10s
</script>
</body>
</html>
